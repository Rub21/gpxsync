[project]
name = "gpxsync"
version = "0.1.0"
description = "Keeps a PostGIS copy of the OpenStreetMap GPS traces up to date from the dump and the replication feed"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
dependencies = ["lxml>=5", "psycopg[binary]>=3.1"]

[project.scripts]
gpxsync = "gpxsync.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gpxsync"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
